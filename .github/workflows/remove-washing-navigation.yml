name: Remove washing navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-washing-navigation.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove pressure-washing navigation and footer links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          changed = []
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              original = text

              # Remove the complete Pressure Washing dropdown when it contains
              # the retired house/roof washing routes.
              text = re.sub(
                  r'<div class="nav-dropdown">\s*<button class="nav-dropbtn"[^>]*>\s*Pressure Washing\s*</button>\s*<div class="nav-menu">.*?</div>\s*</div>',
                  '',
                  text,
                  flags=re.I | re.S,
              )

              # Remove individual retired links and their nearby middle-dot separators.
              for route in ('nocatee-house-washing', 'nocatee-roof-washing'):
                  text = re.sub(
                      rf'\s*(?:&middot;|·)?\s*<a\b[^>]*href="/{route}"[^>]*>.*?</a>\s*(?:&middot;|·)?\s*',
                      ' ',
                      text,
                      flags=re.I | re.S,
                  )

              # Normalize duplicate separators/spacing left by older copied footers.
              text = re.sub(r'(?:\s*(?:&middot;|·)\s*){2,}', ' &middot; ', text)
              text = re.sub(r'>\s*&middot;\s*</nav>', '></nav>', text)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated {len(changed)} HTML files')
          for item in changed:
              print(item)
          PY

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No matching links remained."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html'
          git commit -m "Remove pressure washing links sitewide [skip nav cleanup]"
          git push
